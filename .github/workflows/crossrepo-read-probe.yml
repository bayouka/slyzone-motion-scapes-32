name: Probe current broadleaf preview
on:
  push:
    branches: [noop-check]
    paths:
      - '.github/workflows/crossrepo-read-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current preview shell
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          curl -fLsS 'https://2b2c-pilot-preview.broadleaf-conkerberry.workers.dev/' -o /tmp/probe/index.html
          echo '--- INDEX ---'
          cat /tmp/probe/index.html
          echo '--- HEADERS ---'
          curl -sSI 'https://2b2c-pilot-preview.broadleaf-conkerberry.workers.dev/' > /tmp/probe/headers.txt || true
          cat /tmp/probe/headers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: broadleaf-probe
          path: /tmp/probe/
          retention-days: 1
