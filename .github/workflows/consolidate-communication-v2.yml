name: Consolidate communication v2

on:
  push:
    branches:
      - 4b4c-communication-architecture
    paths:
      - '.github/workflows/consolidate-communication-v2.yml'

permissions:
  contents: write

jobs:
  consolidate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: communication_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d communication_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: communication_v2
    steps:
      - name: Checkout architecture branch
        uses: actions/checkout@v4
        with:
          ref: 4b4c-communication-architecture
          fetch-depth: 0

      - name: Consolidate QA overlays into migrations 002 004 005
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('supabase/migrations_draft/communication_v2')
          pairs = [
              ('002_conversation_security_and_rpcs.sql', '002_direct_unread_semantics.sql', 'QA-validated Direct unread semantics'),
              ('004_request_inheritance.sql', '004_request_rls_safe_wrappers.sql', 'QA-validated auth-scoped Request RLS wrappers'),
              ('005_context_comments_mentions_attachments.sql', '005_context_rls_safe_wrappers.sql', 'QA-validated contextual RLS wrappers and table grants'),
          ]

          for base_name, patch_name, label in pairs:
              base_path = root / base_name
              patch_path = root / patch_name
              base = base_path.read_text(encoding='utf-8')
              patch = patch_path.read_text(encoding='utf-8')

              begin_at = patch.find('begin;')
              commit_at = patch.rfind('commit;')
              if begin_at < 0 or commit_at < 0 or commit_at <= begin_at:
                  raise SystemExit(f'Cannot parse patch transaction: {patch_name}')
              body = patch[begin_at + len('begin;'):commit_at].strip()

              base_commit_at = base.rfind('commit;')
              if base_commit_at < 0:
                  raise SystemExit(f'No final commit in {base_name}')

              marker = f'-- {label}'
              if marker in base:
                  raise SystemExit(f'Overlay already consolidated in {base_name}')

              merged = (
                  base[:base_commit_at].rstrip()
                  + '\n\n'
                  + marker + '\n'
                  + body
                  + '\n\n'
                  + base[base_commit_at:]
              )
              base_path.write_text(merged, encoding='utf-8')
              patch_path.unlink()
          PY

      - name: Rebuild disposable V4.2.2 baseline
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests_draft/communication_v2/baseline_v422.sql
          psql -v ON_ERROR_STOP=1 -c "grant usage on schema app_private to authenticated;"

      - name: Apply exactly six consolidated migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            supabase/migrations_draft/communication_v2/001_conversation_model.sql \
            supabase/migrations_draft/communication_v2/002_conversation_security_and_rpcs.sql \
            supabase/migrations_draft/communication_v2/003_message_formats_and_integrity.sql \
            supabase/migrations_draft/communication_v2/004_request_inheritance.sql \
            supabase/migrations_draft/communication_v2/005_context_comments_mentions_attachments.sql \
            supabase/migrations_draft/communication_v2/006_notification_cutover.sql
          do
            echo "=== Applying ${migration} ==="
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Run all isolated RLS behavior tests
        shell: bash
        working-directory: supabase/tests_draft/communication_v2
        run: |
          set -euo pipefail
          for test_file in \
            010_direct_privacy_and_request_inheritance.sql \
            020_team_project_membership_sync.sql \
            030_message_unread_mentions_notifications.sql \
            040_context_comments_mentions_attachments.sql
          do
            echo "=== Running ${test_file} ==="
            psql -v ON_ERROR_STOP=1 -f "${test_file}"
          done

      - name: Final integrity assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find supabase/migrations_draft/communication_v2 -maxdepth 1 -name '00[1-6]_*.sql' | wc -l)" -eq 6
          test ! -e supabase/migrations_draft/communication_v2/002_direct_unread_semantics.sql
          test ! -e supabase/migrations_draft/communication_v2/004_request_rls_safe_wrappers.sql
          test ! -e supabase/migrations_draft/communication_v2/005_context_rls_safe_wrappers.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if exists(select 1 from pg_trigger where tgname='trg_notify_message' and not tgisinternal) then
              raise exception 'legacy per-message bell trigger still active';
            end if;
            if not exists(select 1 from information_schema.tables where table_schema='public' and table_name='comments') then raise exception 'comments missing'; end if;
            if not exists(select 1 from information_schema.tables where table_schema='public' and table_name='mentions') then raise exception 'mentions missing'; end if;
            if not exists(select 1 from information_schema.tables where table_schema='public' and table_name='attachments') then raise exception 'attachments missing'; end if;
          end $$;
          SQL

      - name: Commit SQL only after green validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "2b2c QA"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations_draft/communication_v2
          git diff --cached --check
          git commit -m "Consolidate validated communication v2 migrations"
          git push origin HEAD:4b4c-communication-architecture
