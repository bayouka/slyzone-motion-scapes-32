name: [ARCHIVED] Native project progress migration v2

# ARCHIVED: historical one-off migration. Do not execute against the current V4.5 runtime.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 4b4c-native-progress-migration-v2
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://4b4c.bayoukadesbois.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply hardened native project progress migration
        run: python3 scripts/native-project-progress-run.py
      - name: Validate transformed sources
        shell: bash
        run: |
          set -euo pipefail
          node --check site/assets/live.js
          node --check site/assets/boot.js
          node --check site/assets/workflow-backend-safe-v1.js
          npm run check
          node scripts/stability-check.mjs
          grep -Fq 'v4.4.7-native-progress' src/worker.js
          grep -Fq 'get_project_summaries_v1' site/assets/live.js
          grep -Fq 'projectServerSummaryCard' site/assets/live.js
          grep -Fq 'set_project_pause_v1' site/assets/live.js
          grep -Fq 'complete_project_v1' site/assets/live.js
          grep -Fq 'reopen_project_v1' site/assets/live.js
          ! grep -Fq 'project-progress-v2.js' site/assets/boot.js
          ! grep -Fq 'new MutationObserver' site/assets/workflow-backend-safe-v1.js
      - name: Commit native implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bayouka'
          git config user.email 'bayoukadesbois@gmail.com'
          git add site/assets/live.js site/assets/boot.js site/index.html src/worker.js scripts/stability-check.mjs
          git diff --cached --quiet && { echo 'No migration changes to commit'; exit 1; }
          git commit -m 'refactor: integrate server project progress natively'
          git push origin HEAD:main
      - name: Deploy stable Worker 4b4c
        run: npx --yes wrangler@4.129.0 deploy
      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            path="$1"; needle="$2"
            for i in $(seq 1 15); do
              code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/probe.out -w '%{http_code}' "$PRODUCTION_URL$path?verify=447b-$GITHUB_SHA-$i" || true)
              if [ "$code" = "200" ] && grep -Fq "$needle" /tmp/probe.out; then return 0; fi
              sleep 3
            done
            cat /tmp/probe.out || true
            return 1
          }
          probe /health '"version":"v4.4.7-native-progress"'
          probe /assets/boot.js 'v4.4.7-native-progress'
          probe /assets/live.js 'get_project_summaries_v1'
          probe /assets/live.js 'projectServerSummaryCard'
          probe /assets/live.js 'complete_project_v1'
          probe / '2b2c — Projets qui avancent ensemble'
