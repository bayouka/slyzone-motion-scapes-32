name: Materialize 4b4c collaborative bundle

on:
  push:
    branches: [4b4c-collab-pilot]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore exact V4.2.2 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          gh run download 34068635111 --repo bayouka/slyzone-motion-scapes-32 --name 2b2c-v422-exact-site --dir site
          echo 'b4de25fc4290f263f79e624e959f6c205678cb5ed103fea31d353957db743e9e  site/assets/live.js' | sha256sum -c -
          echo 'd3cf80e1f10ff4599e341ce73a7fd5dcc66f7a662b285f2b72eec3f363f5911d  site/assets/live.css' | sha256sum -c -

      - name: Apply Home coherence
        working-directory: 4b4c-v4-preview
        run: python apply-home-coherence.py

      - name: Merge Communication V2
        run: |
          set -euo pipefail
          git fetch origin 4b4c-communication-live-preview:refs/remotes/origin/4b4c-communication-live-preview
          mkdir -p /tmp/communication-v2
          for file in livejs.00.b64 livejs.01.b64 livejs.02.b64 livejs.03.b64 livecss.00.b64; do
            git show "refs/remotes/origin/4b4c-communication-live-preview:4b4c-v4-preview/communication-v2-patches/$file" > "/tmp/communication-v2/$file"
          done
          cat /tmp/communication-v2/livejs.00.b64 /tmp/communication-v2/livejs.01.b64 /tmp/communication-v2/livejs.02.b64 /tmp/communication-v2/livejs.03.b64 | base64 -d | gzip -dc | patch -d 4b4c-v4-preview/site -p1 --fuzz=0
          cat /tmp/communication-v2/livecss.00.b64 | base64 -d | gzip -dc > /tmp/communication-livecss.patch
          sed -n '/^+\/\* 2b2c Communication v2/,$p' /tmp/communication-livecss.patch | sed 's/^+//' >> 4b4c-v4-preview/site/assets/live.css
          node --check 4b4c-v4-preview/site/assets/live.js

      - name: Upload exact current collaborative bundle
        uses: actions/upload-artifact@v4
        with:
          name: 4b4c-current-collab-bundle
          path: 4b4c-v4-preview/site
          retention-days: 2
