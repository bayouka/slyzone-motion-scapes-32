name: Lab2 live E2E

on:
  push:
    branches:
      - feature/4b4c2-idea-lab
    paths:
      - '.lab2/e2e-trigger.txt'

permissions:
  contents: read

concurrency:
  group: lab2-live-e2e
  cancel-in-progress: false

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LAB2_E2E_BASE_URL: https://4b4c2-idea-lab-preview.bayoukadesbois.workers.dev
      LAB2_E2E_BEARER_TOKEN: ${{ secrets.LAB2_E2E_BEARER_TOKEN }}
      LAB2_E2E_REPORT_PATH: lab2-live-e2e-report.json
    steps:
      - name: Checkout isolated Lab branch
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Read explicit isolated trigger
        shell: bash
        run: |
          set -euo pipefail
          test -s .lab2/e2e-trigger.txt
          archetype=$(sed -n 's/^archetype=//p' .lab2/e2e-trigger.txt | head -n 1 | tr -d '\r\n')
          case "$archetype" in
            service|saas|marketplace) ;;
            *) echo "Invalid or missing archetype in .lab2/e2e-trigger.txt" >&2; exit 1 ;;
          esac
          echo "LAB2_E2E_ARCHETYPE=$archetype" >> "$GITHUB_ENV"

      - name: Check private E2E credential
        id: credential
        shell: bash
        run: |
          if [ -n "$LAB2_E2E_BEARER_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax check live harness
        run: node --check scripts/lab2-live-e2e.mjs

      - name: Run one bounded live pipeline
        if: steps.credential.outputs.configured == 'true'
        run: node scripts/lab2-live-e2e.mjs

      - name: Write sanitized run summary
        if: always()
        shell: bash
        env:
          E2E_CREDENTIAL_CONFIGURED: ${{ steps.credential.outputs.configured }}
        run: |
          if [ "$E2E_CREDENTIAL_CONFIGURED" != 'true' ]; then
            echo '### 4b4c2 live E2E' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: **BLOCKED_CREDENTIAL**' >> "$GITHUB_STEP_SUMMARY"
            echo '- `LAB2_E2E_BEARER_TOKEN` is not configured; no live AI/search endpoint was called.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -s "$LAB2_E2E_REPORT_PATH" ]; then
            echo '### 4b4c2 live E2E' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: **ERROR_NO_REPORT**' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync(process.env.LAB2_E2E_REPORT_PATH,'utf8'));
          const failed=(r.checks||[]).filter(x=>!x.pass);
          console.log('### 4b4c2 live E2E');
          console.log(`- Archetype: **${r.archetype}**`);
          console.log(`- Status: **${r.status}**`);
          console.log(`- HTTP stages: **${(r.stages||[]).length}**`);
          console.log(`- Total model tokens reported: **${r.usage?.total_tokens||0}**`);
          console.log(`- Failed quality checks: **${failed.length}**`);
          if(r.error)console.log(`- Error: \`${String(r.error).slice(0,240)}\``);
          NODE

      - name: Upload sanitized E2E report
        if: always() && hashFiles('lab2-live-e2e-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lab2-live-e2e-${{ github.run_id }}
          path: lab2-live-e2e-report.json
          retention-days: 7
          if-no-files-found: error
