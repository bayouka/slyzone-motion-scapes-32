name: Apply pre-collaborator fixes

on:
  push:
    branches: [main]
    paths:
      - scripts/pre-collab-fix.mjs
      - .github/workflows/apply-pre-collab-fix.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_URL: https://4b4c.bayoukadesbois.workers.dev

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic source patch
        run: node scripts/pre-collab-fix.mjs
      - name: Validate source
        run: |
          npm run check
          grep -Fq 'register_deliverable_version_v2' site/assets/live.js
          grep -Fq 'PROJETS ACTIFS' site/assets/live.js
          ! grep -Fq "kind:'Préparation',title:m.title" site/assets/live.js
          grep -Fq "m.created_by===state.user.id||state.meetingAttendees.some" site/assets/live.js
      - name: Commit canonical source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/assets/live.js
          git diff --cached --quiet && exit 0
          git commit -m 'Harden collaboration flows before pilot invitations'
          git push origin HEAD:main
      - name: Deploy stable Worker
        run: npx wrangler deploy
      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            path="$1"; needle="$2"
            for i in $(seq 1 12); do
              code=$(curl -L -sS -o /tmp/probe.out -w '%{http_code}' "$PRODUCTION_URL$path" || true)
              if [ "$code" = "200" ] && grep -Fq "$needle" /tmp/probe.out; then return 0; fi
              sleep 3
            done
            return 1
          }
          probe /health '"app":"4b4c"'
          probe /assets/live.js 'register_deliverable_version_v2'
          probe /assets/live.js 'PROJETS ACTIFS'
          probe /assets/home-polish.js '2b2c Home UX/UI reference polish'
