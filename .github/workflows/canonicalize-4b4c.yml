name: Canonicalize 4b4c repository

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/canonicalize-4b4c.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild exact validated V4.3 site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd 4b4c-v4-preview
          rm -rf site
          mkdir -p site
          gh run download 34068635111 --repo bayouka/slyzone-motion-scapes-32 --name 2b2c-v422-exact-site --dir site
          echo 'b4de25fc4290f263f79e624e959f6c205678cb5ed103fea31d353957db743e9e  site/assets/live.js' | sha256sum -c -
          echo 'd3cf80e1f10ff4599e341ce73a7fd5dcc66f7a662b285f2b72eec3f363f5911d  site/assets/live.css' | sha256sum -c -
          python apply-home-coherence.py
          cd ..
          git fetch origin 4b4c-communication-live-preview:refs/remotes/origin/4b4c-communication-live-preview
          mkdir -p /tmp/communication-v2
          for file in livejs.00.b64 livejs.01.b64 livejs.02.b64 livejs.03.b64 livecss.00.b64; do
            git show "refs/remotes/origin/4b4c-communication-live-preview:4b4c-v4-preview/communication-v2-patches/$file" > "/tmp/communication-v2/$file"
          done
          cat /tmp/communication-v2/livejs.00.b64 /tmp/communication-v2/livejs.01.b64 /tmp/communication-v2/livejs.02.b64 /tmp/communication-v2/livejs.03.b64 > /tmp/communication-livejs.b64
          cat /tmp/communication-v2/livecss.00.b64 > /tmp/communication-livecss.b64
          echo 'de8e71f5a2c00699d206475474a5aaee40e3bacf3de5f79359c28bd5c2b45772  /tmp/communication-livejs.b64' | sha256sum -c -
          echo '91c3bc7d343fe1ae625cfc11358a5649f7dd755bbdaf1e23911ec845c9d736a3  /tmp/communication-livecss.b64' | sha256sum -c -
          base64 -d /tmp/communication-livejs.b64 | gzip -dc | patch -d 4b4c-v4-preview/site -p1 --fuzz=0
          base64 -d /tmp/communication-livecss.b64 | gzip -dc > /tmp/communication-livecss.patch
          sed -n '/^+\/\* 2b2c Communication v2/,$p' /tmp/communication-livecss.patch | sed 's/^+//' >> 4b4c-v4-preview/site/assets/live.css
          echo 'cc4aec514d195035ff123fe7221fe4c4688da7683b35fe50f7b7c0ba641b31e1  4b4c-v4-preview/site/assets/live.js' | sha256sum -c -
          echo '89cf7957118eb7f83be2368c4f1df5a04f4e535c2fa245db7e643df324dcef0b  4b4c-v4-preview/site/assets/live.css' | sha256sum -c -
          cat 4b4c-v4-preview/v43-patches/livejs.00.b64 4b4c-v4-preview/v43-patches/livejs.01.b64 4b4c-v4-preview/v43-patches/livejs.02.b64 > /tmp/v43-livejs.b64
          cat 4b4c-v4-preview/v43-patches/livecss.00.b64 > /tmp/v43-livecss.b64
          echo '7b83623dc640b1f967de9e822abca9a8efdb0847ff6191711fbf55cfa46eac14  /tmp/v43-livejs.b64' | sha256sum -c -
          echo '825c04544020d30b74662d56da075934b4c64ab33d9101c24d838172ae24cad1  /tmp/v43-livecss.b64' | sha256sum -c -
          base64 -d /tmp/v43-livejs.b64 | gzip -dc | patch -d 4b4c-v4-preview/site -p1 --fuzz=0
          base64 -d /tmp/v43-livecss.b64 | gzip -dc | patch -d 4b4c-v4-preview/site -p1 --fuzz=0
          rm -f 4b4c-v4-preview/site/assets/live.js.orig
          node --check 4b4c-v4-preview/site/assets/live.js
          echo '8f76a1eebcdbce2435d369601dbcd708ee320bfdf90938231eea243197c9dcce  4b4c-v4-preview/site/assets/live.js' | sha256sum -c -
          echo '89c776671ea9fa3fc6f169faf78590913a24d9f2eb2fc06e897c5b2e6c0c3b12  4b4c-v4-preview/site/assets/live.css' | sha256sum -c -
          grep -Fq 'v43-home-grid' 4b4c-v4-preview/site/assets/live.js
          grep -Fq 'communication-v2-hub' 4b4c-v4-preview/site/assets/live.js
          grep -Fq 'wexfzhegiewhldkugtow.supabase.co' 4b4c-v4-preview/site/runtime-config.js

      - name: Build clean canonical tree
        run: |
          set -euo pipefail
          rm -rf /tmp/4b4c-canonical
          mkdir -p /tmp/4b4c-canonical/site /tmp/4b4c-canonical/src /tmp/4b4c-canonical/.github/workflows
          cp -a 4b4c-v4-preview/site/. /tmp/4b4c-canonical/site/
          cp 4b4c-v4-preview/src/worker.js /tmp/4b4c-canonical/src/worker.js
          sed -i "s/app: '2b2c'/app: '4b4c'/; s/prepilot-v4.2.2/v4.3/" /tmp/4b4c-canonical/src/worker.js
          cat > /tmp/4b4c-canonical/wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "4b4c",
            "main": "src/worker.js",
            "compatibility_date": "2026-09-07",
            "assets": {
              "directory": "./site",
              "binding": "ASSETS",
              "run_worker_first": true,
              "html_handling": "none"
            }
          }
          EOF
          cat > /tmp/4b4c-canonical/package.json <<'EOF'
          {
            "name": "4b4c",
            "version": "4.3.0",
            "private": true,
            "scripts": {
              "check": "node --check site/assets/live.js && node --check site/assets/supabase-client.js && node --check site/assets/boot.js && node --check src/worker.js",
              "deploy": "wrangler deploy",
              "dev": "wrangler dev"
            },
            "devDependencies": {
              "wrangler": "4.129.0"
            }
          }
          EOF
          cat > /tmp/4b4c-canonical/.gitignore <<'EOF'
          node_modules/
          .wrangler/
          .dev.vars
          .env
          .env.*
          !.env.example
          EOF
          cat > /tmp/4b4c-canonical/README.md <<'EOF'
          # 4b4c

          Canonical source for the 4b4c collaborative workspace pilot.

          ## Architecture
          - `site/`: complete client application served as Cloudflare static assets.
          - `src/worker.js`: Cloudflare Worker entry point and SPA fallback.
          - `wrangler.jsonc`: Cloudflare Worker configuration.
          - Supabase project: `wexfzhegiewhldkugtow`.

          ## Branches
          - `main`: stable validated version.
          - `develop`: next version under validation.
          - feature branches: temporary, merged into `develop`, then deleted.

          ## Commands
          ```bash
          npm ci
          npm run check
          npm run dev
          npm run deploy
          ```

          ## Deployment
          `main` is the production source. GitHub Actions deploys the Worker named `4b4c` when Cloudflare credentials are configured as repository secrets `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`.

          The historical experimental branches remain available only as archive/rollback references and are not part of the active build.
          EOF
          cat > /tmp/4b4c-canonical/.github/workflows/ci.yml <<'EOF'
          name: 4b4c CI
          on:
            push:
              branches: [develop, main]
            pull_request:
              branches: [develop, main]
          permissions:
            contents: read
          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run check
                - name: Product integrity
                  run: |
                    set -euo pipefail
                    grep -Fq 'v43-home-grid' site/assets/live.js
                    grep -Fq 'communication-v2-hub' site/assets/live.js
                    grep -Fq 'wexfzhegiewhldkugtow.supabase.co' site/runtime-config.js
                    grep -Fq '4b4c V4.3 — personal situation Home' site/assets/live.css
                    if grep -RInE 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' site src; then exit 1; fi
          EOF
          cat > /tmp/4b4c-canonical/.github/workflows/deploy.yml <<'EOF'
          name: Deploy 4b4c production
          on:
            push:
              branches: [main]
          permissions:
            contents: read
          jobs:
            deploy:
              runs-on: ubuntu-latest
              env:
                CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run check
                - name: Detect Cloudflare credentials
                  id: cloudflare
                  shell: bash
                  run: |
                    if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
                      echo 'configured=true' >> "$GITHUB_OUTPUT"
                    else
                      echo 'configured=false' >> "$GITHUB_OUTPUT"
                    fi
                - name: Deploy stable Worker
                  if: steps.cloudflare.outputs.configured == 'true'
                  run: npx wrangler deploy
                - name: Cloudflare credentials not configured
                  if: steps.cloudflare.outputs.configured != 'true'
                  run: echo 'Cloudflare deployment skipped; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
          EOF
          cd /tmp/4b4c-canonical
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run check
          echo '8f76a1eebcdbce2435d369601dbcd708ee320bfdf90938231eea243197c9dcce  site/assets/live.js' | sha256sum -c -
          echo '89c776671ea9fa3fc6f169faf78590913a24d9f2eb2fc06e897c5b2e6c0c3b12  site/assets/live.css' | sha256sum -c -

      - name: Replace develop tree with canonical source
        run: |
          set -euo pipefail
          git config user.name '4b4c maintenance'
          git config user.email 'actions@users.noreply.github.com'
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/4b4c-canonical/. .
          git add -A
          git commit -m 'Canonicalize 4b4c V4.3 repository'
          git push origin HEAD:develop
