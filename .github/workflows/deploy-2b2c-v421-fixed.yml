name: Deploy 2b2c V4.2.1 fixed preview

on:
  push:
    branches: [4b4c-v4-preview]
    paths:
      - '.github/workflows/deploy-2b2c-v421-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild verified V4.2 baseline
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          cat \
            site-bundle-part-00a.b64 \
            site-bundle-part-00b.b64 \
            site-bundle-part-01.b64 \
            site-bundle-part-02.b64 \
            site-bundle-part-03p0.b64 \
            site-bundle-part-03p1.b64 \
            site-bundle-part-03p2.b64 \
            site-bundle-part-03p3.b64 \
            site-bundle-part-04.b64 \
            site-bundle-part-05.b64 \
            site-bundle-part-06.b64 \
            site-bundle-part-07.b64 > /tmp/4b4c-v4-site.b64
          test "$(wc -c < /tmp/4b4c-v4-site.b64)" = "89936"
          echo '4d5225f592ef7bb9db979b2f0be9d13c4a424c4baeb1a644c7839ca231b595f3  /tmp/4b4c-v4-site.b64' | sha256sum -c -
          rm -rf site
          mkdir -p site
          base64 -d /tmp/4b4c-v4-site.b64 > /tmp/4b4c-v4-site.tar.gz
          tar -xzf /tmp/4b4c-v4-site.tar.gz -C site

          cat v41-livejs-p0.b64 v41-livejs-p1.b64 v41-livejs-p2.b64 v41-livejs-p3.b64 > /tmp/v41-livejs.patch.gz.b64
          echo 'adcf5a43e916b0c84b349f922a0f66a85ce050b73f7a48c9d34d106f5d93a59d  /tmp/v41-livejs.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v41-livejs.patch.gz.b64 | gzip -dc > /tmp/v41-livejs.patch
          echo 'e50aea4bdff3b908092c7ac8db29c205439e3678dd1836cf71a4f3b88f1a517c  v41-livecss.patch.gz.b64' | sha256sum -c -
          base64 -d v41-livecss.patch.gz.b64 | gzip -dc > /tmp/v41-livecss.patch
          echo 'eca1cd180ba1dd77afe96f8392ec3167cbd6a7c8e624784d25e8bff1f7d35ef4  v41-supa.patch.gz.b64' | sha256sum -c -
          base64 -d v41-supa.patch.gz.b64 | gzip -dc > /tmp/v41-supa.patch
          patch -d site -p1 --fuzz=0 < /tmp/v41-livejs.patch
          patch -d site -p1 --fuzz=0 < /tmp/v41-livecss.patch
          patch -d site -p1 --fuzz=0 < /tmp/v41-supa.patch

          cat v42-livejs-p0.b64 v42-livejs-p1.b64 > /tmp/v42-livejs.patch.gz.b64
          echo '2199bf5ebd27ac5892e2db6076336cc18203d5f1bb5cdaf489d0f3eaafe29b7b  /tmp/v42-livejs.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v42-livejs.patch.gz.b64 | gzip -dc > /tmp/v42-livejs.patch
          echo '203d11d39b691a391162d77a95b684a945a5da359a033f7228c3bb6d841cc4b9  v42-livecss.patch.gz.b64' | sha256sum -c -
          base64 -d v42-livecss.patch.gz.b64 | gzip -dc > /tmp/v42-livecss.patch
          patch -d site -p1 --fuzz=0 < /tmp/v42-livejs.patch
          patch -d site -p1 --fuzz=0 < /tmp/v42-livecss.patch

          echo '3e9bb2f8209a3ab6f0596a02a06d3fb12a24cf78460e4591e3118835b63bd22d  site/assets/live.js' | sha256sum -c -

      - name: Apply exact V4.2.1 delta
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06 07; do test -s "v421-livejs-fixed-p${i}.b64"; done
          echo 'ed25036591d8b34848f8d77af9a0786a75adf71c987885623c33140750866d9f  v421-livejs-fixed-p00.b64' | sha256sum -c -
          echo '4431e3d501327eb3611c4c765509f3227ee6ad1bce424b7d3f20970a6ccf86b7  v421-livejs-fixed-p01.b64' | sha256sum -c -
          echo '7ad5b8f5a1cbfcf7592400de9d9aa84531d73fceb5605aebf532c22ba94f0004  v421-livejs-fixed-p02.b64' | sha256sum -c -
          echo 'd3e1a3ba6a86f52de84f1e510863382546d9792f8b954dd29684a13f955ba47e  v421-livejs-fixed-p03.b64' | sha256sum -c -
          echo '03fc120110bac11bda2e9424ff8a2b92bf89de4e4100c2aae1954b32bd87b06a  v421-livejs-fixed-p04.b64' | sha256sum -c -
          echo '1c843b5eac58a2f5bcb22f36cc5a65344e95e9f69724673ae31e28edc1457d7c  v421-livejs-fixed-p05.b64' | sha256sum -c -
          echo 'c64a8b473c5da9ac943109fb8f6c5c72d863403c6beea1db2e38ecd2c67d6edc  v421-livejs-fixed-p06.b64' | sha256sum -c -
          echo '8c39920f65d4f11693115c4d0b07b8fcd6ab9ce4c2e8475622d87166a3f20d82  v421-livejs-fixed-p07.b64' | sha256sum -c -
          cat v421-livejs-fixed-p00.b64 v421-livejs-fixed-p01.b64 v421-livejs-fixed-p02.b64 v421-livejs-fixed-p03.b64 v421-livejs-fixed-p04.b64 v421-livejs-fixed-p05.b64 v421-livejs-fixed-p06.b64 v421-livejs-fixed-p07.b64 > /tmp/v421-livejs.fixed.b64
          test "$(wc -c < /tmp/v421-livejs.fixed.b64)" = "14552"
          echo 'cfd523ed72e0929adefc0f2e6aea45d8d0512285a006a5e1c4fbe14609eb0d26  /tmp/v421-livejs.fixed.b64' | sha256sum -c -
          base64 -d /tmp/v421-livejs.fixed.b64 | gzip -t
          base64 -d /tmp/v421-livejs.fixed.b64 | gzip -dc > /tmp/v421-livejs.fixed.patch

          echo '1806b95cfb3524f62e3dc38d7b1c0560ba2d2a654977e818904243ec5a137a85  v421-livecss.b64' | sha256sum -c -
          echo 'eb86477fce464c749ec10b778c53260dce368e6d2d5f291816a51c535dedb79e  v421-boot.b64' | sha256sum -c -
          echo '5cd9ff43ca949ee2bc5a0a3a0d91b0fbcdf589c4c217ba828306815fbb7835a9  v421-index.b64' | sha256sum -c -
          echo '452a571c10ec162472651bc5de1c4a153f1a36052834ccd83e853a8470ed1f79  v421-favicon.b64' | sha256sum -c -
          base64 -d v421-livecss.b64 | gzip -dc > /tmp/v421-livecss.patch
          base64 -d v421-boot.b64 | gzip -dc > /tmp/v421-boot.patch
          base64 -d v421-index.b64 | gzip -dc > /tmp/v421-index.patch
          base64 -d v421-favicon.b64 | gzip -dc > /tmp/v421-favicon.patch

          patch -d site -p1 --fuzz=0 < /tmp/v421-livejs.fixed.patch
          patch -d site -p1 --fuzz=0 < /tmp/v421-livecss.patch
          patch -d site -p1 --fuzz=0 < /tmp/v421-boot.patch
          patch -d site -p1 --fuzz=0 < /tmp/v421-index.patch
          patch -d site -p1 --fuzz=0 < /tmp/v421-favicon.patch

      - name: Validate exact V4.2.1 output
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          node --check site/assets/live.js
          node --check site/assets/supabase-client.js
          node --check site/assets/boot.js
          node --check src/worker.js
          echo '3863089904eba58301b21383c8c018b331421d8f49b37c28a6b2758dfe4f2d31  site/assets/live.js' | sha256sum -c -
          echo 'e81657d0cb86826c3f5d051f6c59f6361083736eada21c71dcb3f118fae65a04  site/assets/live.css' | sha256sum -c -
          echo '69b34451bd4b0e72b719f707ef18b2063c00c33b487f3a7a4235060f213f61db  site/assets/boot.js' | sha256sum -c -
          echo '92b790d1e297f196a1df25ab80e69d0617e09c3ce5b57adef69eead2e3877dc0  site/assets/favicon.svg' | sha256sum -c -
          echo 'ebae0d1838057f729c378d2497ec040c5e82796ea26014a3696e1db5a8321502  site/index.html' | sha256sum -c -
          echo 'aa434f8a6df764662f71b9c676fc2444d1fe8308bbe19cca2a41676caa95b82c  site/assets/supabase-client.js' | sha256sum -c -
          grep -q 'wexfzhegiewhldkugtow.supabase.co' site/runtime-config.js
          grep -q "const BRAND_NAME = '2b2c'" site/assets/live.js
          grep -q 'v421-shell' site/assets/live.js
          grep -q 'v421-sidebar' site/assets/live.css
          grep -q 'mobile-drawer-scroll' site/assets/live.js
          grep -q 'mobile-drawer-scroll' site/assets/live.css
          grep -q 'overflow-x:clip' site/assets/live.css
          grep -q '<title>2b2c — Projets qui avancent ensemble</title>' site/index.html
          grep -q 'data-action="signout"' site/assets/live.js
          grep -q 'data-action="remove-avatar"' site/assets/live.js
          grep -q 'profile-avatars' site/assets/live.js
          if grep -q "params.get('demo')" site/assets/boot.js; then echo 'Public demo bypass still enabled' >&2; exit 1; fi
          if grep -RInE 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' site src; then echo 'Secret-like material found' >&2; exit 1; fi

      - name: Deploy temporary 2b2c Cloudflare Worker
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 deploy --temporary 2>&1 | tee /tmp/2b2c-v421-fixed-preview.txt

      - name: Smoke deployed 2b2c V4.2.1
        run: |
          set -euo pipefail
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/2b2c-v421-fixed-preview.txt | tail -1)
          test -n "$URL"
          probe() {
            path="$1"; needle="$2"; nav="${3:-0}"
            for i in $(seq 1 15); do
              if [ "$nav" = "1" ]; then
                code=$(curl -L -sS -H 'Sec-Fetch-Mode: navigate' -o /tmp/probe.out -w '%{http_code}' "$URL$path" || true)
              else
                code=$(curl -L -sS -o /tmp/probe.out -w '%{http_code}' "$URL$path" || true)
              fi
              echo "probe $path attempt=$i http=$code bytes=$(wc -c < /tmp/probe.out 2>/dev/null || echo 0)"
              if [ "$code" = "200" ] && grep -q "$needle" /tmp/probe.out; then return 0; fi
              sleep 4
            done
            return 1
          }
          probe / '2b2c — Projets qui avancent ensemble' 1
          probe /runtime-config.js 'wexfzhegiewhldkugtow.supabase.co'
          probe /assets/live.js "const BRAND_NAME = '2b2c'"
          probe /assets/live.js 'mobile-drawer-scroll'
          probe /assets/live.css '2b2c V4.2.1 — brand, shell lock & responsive finish'
          probe /assets/favicon.svg '#38c5ff'
          probe /assets/boot.js 'assets/live.js'
          probe /health 'prepilot-v4.2.1'
          echo "PREVIEW_URL=$URL" | tee /tmp/2b2c-v421-fixed-url.txt

      - name: Preserve deployment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2b2c-v421-fixed-preview-result
          path: |
            /tmp/2b2c-v421-fixed-preview.txt
            /tmp/2b2c-v421-fixed-url.txt
          if-no-files-found: warn
          retention-days: 1
