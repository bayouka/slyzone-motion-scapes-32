name: 4b4c CI

# Manual-only by policy. Production deployment uses the dedicated deploy workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

      - name: Active runtime contract
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "const VERSION = 'v4.5.8-nav-dead-css'" site/assets/boot.js
          grep -Fq "import(`./live.js?" site/assets/boot.js
          grep -Fq "delivery-workflow-v1.js" site/assets/boot.js
          grep -Fq "workflow-backend-safe-v1.js" site/assets/boot.js
          grep -Fq "communication-workspace-v1.js" site/assets/boot.js
          grep -Fq "resources-workspace-v2.js" site/assets/boot.js
          grep -Fq "library-workspace-v1.js" site/assets/boot.js

          ! grep -Fq "home-polish.js" site/assets/boot.js
          ! grep -Fq "workflow-backend-v2.js" site/assets/boot.js
          ! grep -Fq "project-progress-v2.js" site/assets/boot.js
          ! grep -Fq "call-native-v1.js" site/assets/boot.js
          ! grep -Fq "MutationObserver(" site/assets/boot.js

          grep -Fq "assets/design-v5.css?v=5.0.4-nav-dead-css" site/index.html
          grep -Fq "assets/boot.js?build=508" site/index.html
          grep -Fq "resetViewScrollV52" site/assets/live.js
          grep -Fq "v52-mobile-primary" site/assets/live.js
          grep -Fq "open-call-picker-v1" site/assets/live.js
          grep -Fq "heartbeat_call_v1" site/assets/live.js

          grep -Fq "app: '4b4c'" src/worker.js
          grep -Fq "RUNTIME_VERSION='v4.5.16-project-definition-preproject-p3'" src/worker-entry.js
          grep -Fq "import { handleCanonicalIdeaCommand } from './idea-canonical-adapter.js';" src/worker-entry.js
          grep -Fq "url.pathname==='/api/ideas/canonical'" src/worker-entry.js
          grep -Fq "idea_canonical_adapter_v1" src/worker-entry.js
          grep -Fq "g3_promotion_browser_exposed:false" src/worker-entry.js
          grep -Fq "decision_actor_from_jwt:true" src/worker-entry.js
          grep -Fq "const COMMANDS=new Set(['canonical.read','decision.record']);" src/idea-canonical-adapter.js
          grep -Fq "p_decided_by:auth.user.id" src/idea-canonical-adapter.js
          ! grep -Fq "promote_canonical_approved_idea_to_project_definition_v2" src/idea-canonical-adapter.js

      - name: Repository safety contract
        shell: bash
        run: |
          set -euo pipefail

          if find .github -maxdepth 1 -type f -name 'deploy-once-*' | grep -q .; then
            echo 'Temporary deploy marker left in repository' >&2
            exit 1
          fi

          if grep -RInE 'sb_secret_' site src; then
            echo 'Secret-like material found in public application' >&2
            exit 1
          fi

          # Server-side source may legitimately reference the service-role binding name,
          # but it must never serialize a value or expose the privileged G3 RPC on a browser route.
          ! grep -RInE 'service_role[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9._-]+' site src
          ! grep -RIn "promote_canonical_approved_idea_to_project_definition_v2" src/idea-canonical-adapter.js

          # Historical migration workflows must never deploy automatically.
          for wf in \
            .github/workflows/native-access-migrate.yml \
            .github/workflows/native-progress-migrate.yml \
            .github/workflows/native-progress-migrate-v2.yml
          do
            grep -Fq 'workflow_dispatch:' "$wf"
            ! grep -Eq '^[[:space:]]+push:' "$wf"
          done
