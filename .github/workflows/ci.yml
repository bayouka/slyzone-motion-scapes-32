name: 4b4c CI

# Cloudflare Workers Builds is the active deployment path. Keep GitHub Actions manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Product integrity
        run: |
          set -euo pipefail
          grep -Fq 'v43-home-grid' site/assets/live.js
          grep -Fq 'communication-v2-hub' site/assets/live.js
          grep -Fq 'register_deliverable_version_v2' site/assets/live.js
          grep -Fq 'PROJETS ACTIFS' site/assets/live.js
          grep -Fq "m.created_by===state.user.id||state.meetingAttendees.some" site/assets/live.js
          ! grep -Fq "kind:'Préparation',title:m.title" site/assets/live.js
          grep -Fq 'wexfzhegiewhldkugtow.supabase.co' site/runtime-config.js
          grep -Fq '4b4c V4.3 — personal situation Home' site/assets/live.css
          grep -Fq '4b4c V4.3.1 — Home UX contract polish' site/assets/home-polish.js
          grep -Fq '4b4c V4.3.1 — Home UX/UI polish' site/assets/home-polish.css
          grep -Fq 'assets/home-polish.css' site/index.html
          grep -Fq "import('./home-polish.js')" site/assets/boot.js
          grep -Fq "import('./workflow-backend-v2.js')" site/assets/boot.js
          grep -Fq "import('./project-progress-v2.js')" site/assets/boot.js
          grep -Fq 'Configuration 2b2c indisponible' site/assets/boot.js
          ! grep -Fq 'assets/app.js' site/assets/boot.js
          grep -Fq "app: '4b4c'" src/worker.js
          if grep -RInE 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' site src; then
            echo 'Secret-like material found in public application' >&2
            exit 1
          fi
