name: Deploy 4b4c production

# Production deployment is explicit/manual by default.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 4b4c-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://4b4c.bayoukadesbois.workers.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --check site/assets/workflow-backend-safe-v1.js
      - name: Verify stable production payload
        run: node scripts/stability-check.mjs
      - name: Detect Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy stable Worker 4b4c
        run: npx --yes wrangler@4.129.0 deploy
      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            path="$1"; needle="$2"
            for i in $(seq 1 15); do
              code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/probe.out -w '%{http_code}' "$PRODUCTION_URL$path?manual-$GITHUB_SHA-$i" || true)
              echo "probe $path attempt=$i http=$code"
              if [ "$code" = "200" ] && grep -Fq -- "$needle" /tmp/probe.out; then return 0; fi
              sleep 3
            done
            cat /tmp/probe.out || true
            return 1
          }
          probe /health '"version":"v4.5.2-navigation-flow"'
          probe /assets/boot.js "v4.5.2-navigation-flow"
          probe /assets/boot.js "communication-workspace-v1.js"
          probe /assets/live.js "open-call-picker-v1"
          probe /assets/live.js "start_private_call_v2"
          probe /assets/live.js "invite_to_call_v1"
          probe /assets/live.js "respond_call_invite_v1"
          probe /assets/live.js "call-stage-focus-v2"
          probe /assets/live.js "call-pip-v2"
          probe /assets/live.js "call-minimize-v1"
          probe /assets/live.js "2b2c:start-call"
          probe /assets/communication-workspace-v1.js "call-conversation"
          probe /assets/live.js "call-switch-camera-v1"
          probe /assets/live.js "facingMode:{ideal:'user'}"
          probe /assets/live.js "call-prejoin-confirm-v1"
          probe /assets/live.js "heartbeat_call_v1"
          probe /assets/live.js "call-shell-pro-v4"
          probe /assets/live.js "resumableCallV1"
          probe /assets/live.js "formatCallDurationV1"
          probe /assets/live.js "call-fullscreen-v1"
          probe /assets/live.js "requestEndActiveCallV1"
          probe /assets/live.js "call-prejoin-context-v5"
          probe /assets/live.js "call-presence-chip-v5"
          probe /assets/live.js "updateCallNetworkQualityV1"
          probe /assets/live.js "openCallDevicesV1"
          probe /assets/live.js "call-sharing-banner-v6"
          probe /assets/call-native-v1.css "essential call tools"
          probe /assets/live.js "toggleCallMoreV7"
          probe /assets/live.js "toggleCallPipV7"
          probe /assets/live.js "call-controls-polish-v7"
          probe /assets/call-native-v1.css "call UI polish & motion"
          probe /assets/call-native-v1.css "prefers-reduced-motion"
          probe /assets/design-v5.css "Soft Spatial Workspace"
