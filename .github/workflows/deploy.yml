name: Deploy 4b4c production

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 4b4c-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://4b4c.bayoukadesbois.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Verify stability-safe production payload
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'v4.4.5-stability-safe' src/worker.js
          grep -Fq 'v4.4.5-stability-safe' site/index.html
          grep -Fq "window.__4B4C_STABILITY_MODE__ = VERSION" site/assets/boot.js
          grep -Fq 'pollIntervalMs: Math.max(60000' site/assets/boot.js
          grep -Fq 'invite-prelive-v2.js' site/assets/boot.js
          grep -Fq 'workflow-backend-safe-v1.js' site/assets/boot.js
          ! grep -Fq "auth-recovery-v1.js" site/assets/boot.js
          ! grep -Fq "home-polish.js" site/assets/boot.js
          ! grep -Fq "team-access-v1.js" site/assets/boot.js
          ! grep -Fq "ui-quality-v1.js" site/assets/boot.js
          ! grep -Fq "dialog-focus-safety-v2.js" site/assets/boot.js
          ! grep -Fq "project-progress-v2.js" site/assets/boot.js
          ! grep -Fq 'MutationObserver' site/assets/workflow-backend-safe-v1.js
          grep -Fq 'wexfzhegiewhldkugtow.supabase.co' site/runtime-config.js
      - name: Detect Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy stable Worker 4b4c
        run: npx --yes wrangler@4.129.0 deploy
      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            path="$1"; needle="$2"
            for i in $(seq 1 15); do
              code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/probe.out -w '%{http_code}' "$PRODUCTION_URL$path?verify=445-$GITHUB_SHA" || true)
              if [ "$code" = "200" ] && grep -Fq "$needle" /tmp/probe.out; then return 0; fi
              sleep 3
            done
            cat /tmp/probe.out || true
            return 1
          }
          probe /health '"version":"v4.4.5-stability-safe"'
          probe /assets/boot.js 'workflow-backend-safe-v1.js'
          probe /assets/boot.js 'pollIntervalMs: Math.max(60000'
          probe /assets/workflow-backend-safe-v1.js 'no MutationObserver'
          probe / '2b2c — Projets qui avancent ensemble'
