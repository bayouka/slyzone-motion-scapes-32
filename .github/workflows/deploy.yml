name: Deploy 4b4c production

# Production deployment is explicit/manual by default.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/deploy-once-camera-v1.txt

permissions:
  contents: read
  statuses: write

concurrency:
  group: 4b4c-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://4b4c.bayoukadesbois.workers.dev
    steps:
      - uses: actions/checkout@v5
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"pending","context":"4b4c-production-deploy","description":"Deploying v4.4.15 camera controls"}'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --check site/assets/workflow-backend-safe-v1.js
      - name: Verify stable production payload
        run: node scripts/stability-check.mjs
      - name: Detect Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy stable Worker 4b4c
        run: npx --yes wrangler@4.129.0 deploy
      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            path="$1"; needle="$2"
            for i in $(seq 1 15); do
              code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/probe.out -w '%{http_code}' "$PRODUCTION_URL$path?manual-$GITHUB_SHA-$i" || true)
              echo "probe $path attempt=$i http=$code"
              if [ "$code" = "200" ] && grep -Fq "$needle" /tmp/probe.out; then return 0; fi
              sleep 3
            done
            cat /tmp/probe.out || true
            return 1
          }
          probe /health '"version":"v4.4.15-camera-controls"'
          probe /assets/boot.js "v4.4.15-camera-controls"
          probe /assets/boot.js "communication-workspace-v1.js"
          probe /assets/live.js "open-call-picker-v1"
          probe /assets/live.js "start_direct_call_v1"
          probe /assets/live.js "call-switch-camera-v1"
          probe /assets/live.js "facingMode:{ideal:'user'}"
          probe / "assets/boot.js?build=455"
          probe / '2b2c — Projets qui avancent ensemble'

      - name: Mark deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"4b4c-production-deploy","description":"v4.4.15 camera controls live on Cloudflare"}'
