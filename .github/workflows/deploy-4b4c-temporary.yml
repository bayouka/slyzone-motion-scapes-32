name: Deploy 4b4c temporary preview
on:
  push:
    branches: [4b4c-pilot-deploy]
    paths:
      - '4b4c-deploy/**'
      - '.github/workflows/deploy-4b4c-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4b4c-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Verify public bundle
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/runtime-config.js
          test -f site/assets/live-v2-loader.js
          test -f site/assets/live-v2-overrides.css
          test -f site/assets/supabase-client.js
          test -f src/worker.js
          for i in 00 01 02 03 04 05 06 07 08 09 10 11; do test -f "site/assets/live-v2-part-$i.txt"; done
          cat site/assets/live-v2-part-*.txt > /tmp/live-v2-source.js
          sed "s#import { SupabaseBrowserClient, ApiError } from './supabase-client.js';#const { SupabaseBrowserClient, ApiError } = await import('https://example.invalid/supabase-client.js');#" /tmp/live-v2-source.js > /tmp/live-v2-source.mjs
          node --check /tmp/live-v2-source.mjs
          node --check site/assets/supabase-client.js
          node --check site/assets/live-v2-loader.js
          node --check src/worker.js
          ! grep -RInE 'service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET' site src
      - name: Deploy temporary Cloudflare Worker
        run: npx --yes wrangler@4.129.0 deploy --temporary 2>&1 | tee /tmp/wrangler-output.txt
      - name: Capture preview URL
        run: |
          set -euo pipefail
          LIVE_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-output.txt | tail -1)"
          test -n "$LIVE_URL"
          echo "Live URL: $LIVE_URL"
          printf '%s\n' "$LIVE_URL" > /tmp/live-url.txt
          for attempt in $(seq 1 15); do
            status="$(curl -LsS -o /tmp/index.html -w '%{http_code}' -H 'Accept: text/html' -H 'Sec-Fetch-Mode: navigate' "$LIVE_URL/" || true)"
            echo "HTTP attempt $attempt: $status"
            [ "$status" = "200" ] && break
            sleep 2
          done
          test "$status" = "200"
      - name: Save deployment result
        if: always()
        run: |
          mkdir -p deployment-result
          cp /tmp/wrangler-output.txt deployment-result/wrangler-output.txt 2>/dev/null || true
          cp /tmp/live-url.txt deployment-result/live-url.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4b4c-cloudflare-result
          path: 4b4c-deploy/deployment-result/
          if-no-files-found: ignore
          retention-days: 1
