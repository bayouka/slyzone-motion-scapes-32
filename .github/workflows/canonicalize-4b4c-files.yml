name: Canonicalize 4b4c files
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/canonicalize-4b4c-files.yml']
permissions:
  contents: write
  actions: read
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recover exact validated V4.3 bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v43 /tmp/canonical
          mkdir -p /tmp/v43 /tmp/canonical/site /tmp/canonical/src
          gh run download 34094417104 --repo bayouka/slyzone-motion-scapes-32 --name 4b4c-collab-v43-result --dir /tmp/v43
          LIVE=$(find /tmp/v43 -type f -path '*/site/assets/live.js' | head -1)
          test -n "$LIVE"
          SITE=$(dirname "$(dirname "$LIVE")")
          echo '8f76a1eebcdbce2435d369601dbcd708ee320bfdf90938231eea243197c9dcce  '"$LIVE" | sha256sum -c -
          cp -a "$SITE"/. /tmp/canonical/site/
          rm -f /tmp/canonical/site/assets/live.js.orig
          echo '89c776671ea9fa3fc6f169faf78590913a24d9f2eb2fc06e897c5b2e6c0c3b12  /tmp/canonical/site/assets/live.css' | sha256sum -c -
      - name: Create canonical project files
        run: |
          set -euo pipefail
          cat > /tmp/canonical/src/worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (request.method !== 'GET' && request.method !== 'HEAD') return new Response('Method Not Allowed', { status: 405 });
              if (url.pathname === '/health') return Response.json({ ok: true, app: '4b4c', backend: 'supabase', version: 'v4.3' }, { headers: { 'cache-control': 'no-store' } });
              const assetRequest = new Request(new URL(url.pathname === '/' ? '/index.html' : url.pathname, url.origin), request);
              let response = await env.ASSETS.fetch(assetRequest);
              if (response.status === 404 && request.headers.get('sec-fetch-mode') === 'navigate') response = await env.ASSETS.fetch(new Request(new URL('/index.html', url.origin), request));
              return response;
            }
          };
          EOF
          cat > /tmp/canonical/wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "4b4c",
            "main": "src/worker.js",
            "compatibility_date": "2026-09-07",
            "assets": { "directory": "./site", "binding": "ASSETS", "run_worker_first": true, "html_handling": "none" }
          }
          EOF
          cat > /tmp/canonical/package.json <<'EOF'
          {
            "name": "4b4c",
            "version": "4.3.0",
            "private": true,
            "scripts": {
              "check": "node --check site/assets/live.js && node --check site/assets/supabase-client.js && node --check site/assets/boot.js && node --check src/worker.js",
              "deploy": "wrangler deploy",
              "dev": "wrangler dev"
            },
            "devDependencies": { "wrangler": "4.129.0" }
          }
          EOF
          cat > /tmp/canonical/.gitignore <<'EOF'
          node_modules/
          .wrangler/
          .dev.vars
          .env
          .env.*
          !.env.example
          EOF
          cat > /tmp/canonical/README.md <<'EOF'
          # 4b4c

          Canonical source of the 4b4c collaborative workspace.

          ## Active architecture
          - `site/` — complete V4.3 client application.
          - `src/worker.js` — Cloudflare Worker / SPA fallback.
          - `wrangler.jsonc` — stable Cloudflare Worker configuration (`4b4c`).
          - Supabase backend — `wexfzhegiewhldkugtow`.

          ## Branch policy
          - `main` — stable validated source.
          - `develop` — next validated version.
          - feature branches — short-lived only.
          - `backup/pre-cleanup-v43` — rollback snapshot of the historical experimental structure.

          ## Local commands
          ```bash
          npm ci
          npm run check
          npm run dev
          ```

          Historical Base64 bundles and patch chains are no longer part of the active source tree.
          EOF
          cd /tmp/canonical
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run check
          grep -Fq 'v43-home-grid' site/assets/live.js
          grep -Fq 'communication-v2-hub' site/assets/live.js
          grep -Fq 'wexfzhegiewhldkugtow.supabase.co' site/runtime-config.js
          if grep -RInE 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' site src; then exit 1; fi
      - name: Replace active source while preserving workflow directory
        run: |
          set -euo pipefail
          git config user.name '4b4c maintenance'
          git config user.email 'actions@users.noreply.github.com'
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/canonical/. .
          git add -A -- . ':!.github'
          git commit -m 'Canonicalize active 4b4c V4.3 source'
          git push origin HEAD:develop
# trigger run
