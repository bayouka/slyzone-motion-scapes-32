name: Validate communication v2

on:
  push:
    branches:
      - 4b4c-communication-architecture
    paths:
      - 'supabase/migrations_draft/communication_v2/**'
      - 'supabase/tests_draft/communication_v2/**'
      - '.github/workflows/validate-communication-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  communication-v2-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: communication_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d communication_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: communication_v2

    steps:
      - name: Checkout isolated architecture branch
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          psql -v ON_ERROR_STOP=1 -Atc "select version();"

      - name: Rebuild V4.2.2 communication baseline
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -f supabase/tests_draft/communication_v2/baseline_v422.sql
          # Read-only introspection of the live V4.2.2 confirmed that the
          # authenticated role has USAGE on app_private. Reproduce that grant
          # in the disposable clone so legacy public wrapper RPCs behave alike.
          psql -v ON_ERROR_STOP=1 -c "grant usage on schema app_private to authenticated;"

      - name: Apply Communication v2 draft migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            supabase/migrations_draft/communication_v2/001_conversation_model.sql \
            supabase/migrations_draft/communication_v2/002_conversation_security_and_rpcs.sql \
            supabase/migrations_draft/communication_v2/003_message_formats_and_integrity.sql \
            supabase/migrations_draft/communication_v2/004_request_inheritance.sql \
            supabase/migrations_draft/communication_v2/005_context_comments_mentions_attachments.sql \
            supabase/migrations_draft/communication_v2/006_notification_cutover.sql
          do
            echo "=== Applying ${migration} ==="
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Assert target schema exists
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists(select 1 from information_schema.columns where table_schema='public' and table_name='conversations' and column_name='linked_project_id') then
              raise exception 'linked_project_id missing';
            end if;
            if not exists(select 1 from information_schema.columns where table_schema='public' and table_name='messages' and column_name='format') then
              raise exception 'messages.format missing';
            end if;
            if not exists(select 1 from information_schema.tables where table_schema='public' and table_name='comments') then
              raise exception 'comments table missing';
            end if;
            if not exists(select 1 from information_schema.tables where table_schema='public' and table_name='mentions') then
              raise exception 'mentions table missing';
            end if;
            if not exists(select 1 from information_schema.tables where table_schema='public' and table_name='attachments') then
              raise exception 'attachments table missing';
            end if;
          end $$;
          SQL

      - name: Run RLS and communication behavior tests
        shell: bash
        working-directory: supabase/tests_draft/communication_v2
        run: |
          set -euo pipefail
          for test_file in \
            010_direct_privacy_and_request_inheritance.sql \
            020_team_project_membership_sync.sql \
            030_message_unread_mentions_notifications.sql \
            040_context_comments_mentions_attachments.sql
          do
            echo "=== Running ${test_file} ==="
            psql -v ON_ERROR_STOP=1 -f "${test_file}"
          done

      - name: Final integrity summary
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          select 'conversation kinds' as check_name, pg_get_constraintdef(oid) as result
          from pg_constraint
          where conname='conversations_kind_check';

          select 'message bell trigger removed' as check_name,
                 case when exists(
                   select 1 from pg_trigger where tgname='trg_notify_message' and not tgisinternal
                 ) then 'FAIL' else 'OK' end as result;

          select 'communication v2 tables' as check_name,
                 string_agg(table_name,', ' order by table_name) as result
          from information_schema.tables
          where table_schema='public' and table_name in ('comments','mentions','attachments');
          SQL
