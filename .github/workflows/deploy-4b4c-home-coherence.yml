name: Deploy 4b4c V4.2.2 Home coherence preview

on:
  push:
    branches: [4b4c-v422-home-coherence]
    paths:
      - '4b4c-v4-preview/apply-home-coherence.py'
      - '.github/workflows/deploy-4b4c-home-coherence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore exact deployed V4.2.2 site
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          gh run download 34068635111 \
            --repo bayouka/slyzone-motion-scapes-32 \
            --name 2b2c-v422-exact-site \
            --dir site
          echo 'b4de25fc4290f263f79e624e959f6c205678cb5ed103fea31d353957db743e9e  site/assets/live.js' | sha256sum -c -
          echo 'd3cf80e1f10ff4599e341ce73a7fd5dcc66f7a662b285f2b72eec3f363f5911d  site/assets/live.css' | sha256sum -c -
          echo '5d15120c9efa2dac43e7b83c54105811f4eb47be79c63107220865a465e4e60a  site/index.html' | sha256sum -c -

      - name: Apply Home coherence corrections
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          python apply-home-coherence.py
          node --check site/assets/live.js
          node --check site/assets/supabase-client.js
          node --check site/assets/boot.js
          grep -Fq '4b4c V4.2.2 — Home coherence pass 2' site/assets/live.css
          grep -Fq 'state.mobileMenuOpen=false; state.userMenuOpen=false; state.notificationOpen=false; render();' site/assets/live.js
          grep -Fq 'slice(0,3).map(projectCardV3)' site/assets/live.js
          grep -Fq 'v422-main-flow' site/assets/live.js
          grep -Fq 'v422-rail-flow' site/assets/live.js
          grep -Fq ' à traiter' site/assets/live.js
          if grep -Fq 'space-signal-card v422-signals' site/assets/live.js; then
            echo 'Redundant signal card still present' >&2
            exit 1
          fi
          sed -i 's/prepilot-v4.2.2/prepilot-v4.2.2-home-coherence-2/' src/worker.js
          node --check src/worker.js

      - name: Deploy isolated temporary Cloudflare Worker
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 deploy --temporary 2>&1 | tee /tmp/4b4c-home-preview.txt

      - name: Smoke deployed Home preview
        run: |
          set -euo pipefail
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/4b4c-home-preview.txt | tail -1)
          test -n "$URL"
          probe() {
            path="$1"; needle="$2"; nav="${3:-0}"
            for i in $(seq 1 10); do
              if [ "$nav" = "1" ]; then
                code=$(curl -L -sS -H 'Sec-Fetch-Mode: navigate' -o /tmp/probe.out -w '%{http_code}' "$URL$path" || true)
              else
                code=$(curl -L -sS -o /tmp/probe.out -w '%{http_code}' "$URL$path" || true)
              fi
              echo "probe $path attempt=$i http=$code bytes=$(wc -c < /tmp/probe.out 2>/dev/null || echo 0)"
              if [ "$code" = "200" ] && grep -Fq "$needle" /tmp/probe.out; then return 0; fi
              sleep 3
            done
            return 1
          }
          probe / '2b2c — Projets qui avancent ensemble' 1
          probe /runtime-config.js 'wexfzhegiewhldkugtow.supabase.co'
          probe /assets/live.js 'v422-main-flow'
          probe /assets/live.css '4b4c V4.2.2 — Home coherence pass 2'
          probe /health 'prepilot-v4.2.2-home-coherence-2'
          echo "PREVIEW_URL=$URL" | tee /tmp/4b4c-home-url.txt

      - name: Preserve preview result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4b4c-v422-home-coherence-preview-result
          path: |
            /tmp/4b4c-home-preview.txt
            /tmp/4b4c-home-url.txt
          if-no-files-found: warn
          retention-days: 2
