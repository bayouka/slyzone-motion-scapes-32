name: Export exact 2b2c V4.2.2 site

on:
  push:
    branches: [4b4c-v4-preview]
    paths:
      - '.github/workflows/export-v422-site.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild verified V4.2.2 exact output
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          cat site-bundle-part-00a.b64 site-bundle-part-00b.b64 site-bundle-part-01.b64 site-bundle-part-02.b64 site-bundle-part-03p0.b64 site-bundle-part-03p1.b64 site-bundle-part-03p2.b64 site-bundle-part-03p3.b64 site-bundle-part-04.b64 site-bundle-part-05.b64 site-bundle-part-06.b64 site-bundle-part-07.b64 > /tmp/base.b64
          test "$(wc -c < /tmp/base.b64)" = "89936"
          echo '4d5225f592ef7bb9db979b2f0be9d13c4a424c4baeb1a644c7839ca231b595f3  /tmp/base.b64' | sha256sum -c -
          rm -rf site && mkdir -p site
          base64 -d /tmp/base.b64 | tar -xzf - -C site

          cat v41-livejs-p0.b64 v41-livejs-p1.b64 v41-livejs-p2.b64 v41-livejs-p3.b64 > /tmp/v41-js.b64
          base64 -d /tmp/v41-js.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v41-livecss.patch.gz.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v41-supa.patch.gz.b64 | gzip -dc | patch -d site -p1 --fuzz=0

          cat v42-livejs-p0.b64 v42-livejs-p1.b64 > /tmp/v42-js.b64
          base64 -d /tmp/v42-js.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v42-livecss.patch.gz.b64 | gzip -dc | patch -d site -p1 --fuzz=0

          cat v421-livejs-fixed-p00.b64 v421-livejs-fixed-p01.b64 v421-livejs-fixed-p02.b64 v421-livejs-fixed-p03.b64 v421-livejs-fixed-p04.b64 v421-livejs-fixed-p05.b64 v421-livejs-fixed-p06.b64 v421-livejs-fixed-p07.b64 > /tmp/v421-js.b64
          base64 -d /tmp/v421-js.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v421-livecss.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v421-boot.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v421-index.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v421-favicon.b64 | gzip -dc | patch -d site -p1 --fuzz=0

          base64 -d v422-livejs.patch.gz.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v422-livecss.patch.gz.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          base64 -d v422-index.patch.gz.b64 | gzip -dc | patch -d site -p1 --fuzz=0
          cp v422-brand-icon.svg site/assets/brand-icon.svg
          cp v422-brand-icon-mono-dark.svg site/assets/brand-icon-mono-dark.svg
          cp v422-brand-icon-mono-light.svg site/assets/brand-icon-mono-light.svg
          cp v422-brand-lockup.svg site/assets/brand-lockup.svg

          echo 'b4de25fc4290f263f79e624e959f6c205678cb5ed103fea31d353957db743e9e  site/assets/live.js' | sha256sum -c -
          echo 'd3cf80e1f10ff4599e341ce73a7fd5dcc66f7a662b285f2b72eec3f363f5911d  site/assets/live.css' | sha256sum -c -
          node --check site/assets/live.js

      - name: Upload exact V4.2.2 site
        uses: actions/upload-artifact@v4
        with:
          name: 2b2c-v422-exact-site
          path: 4b4c-v4-preview/site
          if-no-files-found: error
          retention-days: 1
