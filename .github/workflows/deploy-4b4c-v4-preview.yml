name: Deploy 4b4c V4.1 preview

on:
  push:
    branches: [4b4c-v4-preview]
    paths:
      - '4b4c-v4-preview/**'
      - '.github/workflows/deploy-4b4c-v4-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild V4 baseline and apply V4.1 delta
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          cat \
            site-bundle-part-00a.b64 \
            site-bundle-part-00b.b64 \
            site-bundle-part-01.b64 \
            site-bundle-part-02.b64 \
            site-bundle-part-03p0.b64 \
            site-bundle-part-03p1.b64 \
            site-bundle-part-03p2.b64 \
            site-bundle-part-03p3.b64 \
            site-bundle-part-04.b64 \
            site-bundle-part-05.b64 \
            site-bundle-part-06.b64 \
            site-bundle-part-07.b64 > /tmp/4b4c-v4-site.b64
          test "$(wc -c < /tmp/4b4c-v4-site.b64)" = "89936"
          echo '4d5225f592ef7bb9db979b2f0be9d13c4a424c4baeb1a644c7839ca231b595f3  /tmp/4b4c-v4-site.b64' | sha256sum -c -
          rm -rf site
          mkdir -p site
          base64 -d /tmp/4b4c-v4-site.b64 > /tmp/4b4c-v4-site.tar.gz
          tar -xzf /tmp/4b4c-v4-site.tar.gz -C site

          cat v41-livejs-p0.b64 v41-livejs-p1.b64 v41-livejs-p2.b64 v41-livejs-p3.b64 > /tmp/livejs.patch.gz.b64
          echo 'adcf5a43e916b0c84b349f922a0f66a85ce050b73f7a48c9d34d106f5d93a59d  /tmp/livejs.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/livejs.patch.gz.b64 | gzip -dc > /tmp/livejs.patch

          echo 'e50aea4bdff3b908092c7ac8db29c205439e3678dd1836cf71a4f3b88f1a517c  v41-livecss.patch.gz.b64' | sha256sum -c -
          base64 -d v41-livecss.patch.gz.b64 | gzip -dc > /tmp/livecss.patch

          echo 'eca1cd180ba1dd77afe96f8392ec3167cbd6a7c8e624784d25e8bff1f7d35ef4  v41-supa.patch.gz.b64' | sha256sum -c -
          base64 -d v41-supa.patch.gz.b64 | gzip -dc > /tmp/supa.patch

          patch -d site -p1 --fuzz=0 < /tmp/livejs.patch
          patch -d site -p1 --fuzz=0 < /tmp/livecss.patch
          patch -d site -p1 --fuzz=0 < /tmp/supa.patch

      - name: Validate V4.1 UX and profile flow
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          node --check site/assets/live.js
          node --check site/assets/supabase-client.js
          node --check site/assets/boot.js
          node --check src/worker.js
          test -s site/index.html
          test -s site/assets/styles.css
          test -s site/assets/live.css
          grep -q 'wexfzhegiewhldkugtow.supabase.co' site/runtime-config.js
          grep -q 'À traiter maintenant' site/assets/live.js
          grep -q 'Ce qui a changé' site/assets/live.js
          grep -q 'PROJETS RÉCENTS' site/assets/live.js
          grep -q 'mark_workspace_seen' site/assets/live.js
          grep -q 'data-action="signout"' site/assets/live.js
          grep -q 'data-action="edit-profile"' site/assets/live.js
          grep -q 'data-action="remove-avatar"' site/assets/live.js
          grep -q 'profile-avatars' site/assets/live.js
          grep -q 'upsert:true' site/assets/live.js
          grep -q 'removeObject' site/assets/supabase-client.js
          grep -q 'v41-sidebar' site/assets/live.css
          grep -q 'user-menu-panel' site/assets/live.css
          grep -q 'v41-project-card' site/assets/live.css
          if grep -q 'Mémoire active' site/assets/live.js; then echo 'Ambiguous memory badge still present' >&2; exit 1; fi
          if grep -q 'État du pilote' site/assets/live.js; then echo 'Technical pilot copy still visible' >&2; exit 1; fi
          if grep -RInE 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' site src; then
            echo 'Secret-like material found in public preview' >&2
            exit 1
          fi

      - name: Deploy temporary Cloudflare Worker
        working-directory: 4b4c-v4-preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 deploy --temporary 2>&1 | tee /tmp/4b4c-v41-preview.txt

      - name: Smoke V4.1 preview URL
        run: |
          set -euo pipefail
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/4b4c-v41-preview.txt | tail -1)
          test -n "$URL"
          probe() {
            path="$1"; needle="$2"; nav="${3:-0}"
            for i in $(seq 1 15); do
              if [ "$nav" = "1" ]; then
                code=$(curl -L -sS -H 'Sec-Fetch-Mode: navigate' -o /tmp/probe.out -w '%{http_code}' "$URL$path" || true)
              else
                code=$(curl -L -sS -o /tmp/probe.out -w '%{http_code}' "$URL$path" || true)
              fi
              echo "probe $path attempt=$i http=$code bytes=$(wc -c < /tmp/probe.out 2>/dev/null || echo 0)"
              if [ "$code" = "200" ] && grep -q "$needle" /tmp/probe.out; then return 0; fi
              sleep 4
            done
            return 1
          }
          probe / '4b4c — Espace projet partagé' 1
          probe /runtime-config.js 'wexfzhegiewhldkugtow.supabase.co'
          probe /assets/live.js 'À traiter maintenant'
          probe /assets/live.js 'remove-avatar'
          probe /assets/live.css 'v41-sidebar'
          probe /health 'prepilot-v4.1'
          echo "PREVIEW_URL=$URL" | tee /tmp/4b4c-v41-url.txt

      - name: Preserve deployment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4b4c-v41-preview-result
          path: |
            /tmp/4b4c-v41-preview.txt
            /tmp/4b4c-v41-url.txt
          if-no-files-found: warn
          retention-days: 1
