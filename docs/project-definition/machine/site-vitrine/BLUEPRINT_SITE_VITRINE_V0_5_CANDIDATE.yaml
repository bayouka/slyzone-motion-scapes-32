schema_version: '0.2'
blueprint_id: SITE_VITRINE
blueprint_version: '0.5'
status: R0_EXECUTABLE_CANDIDATE_NON_ACTIVE
parent_architecture: PROJECT_DEFINITION_REFERENCE_ARCHITECTURE_V0_4
atom_schema: ../REQUIREMENT_ATOM_SCHEMA_V0_2.md

load_order:
  - CONTEXT_OVERLAYS_V0_3.yaml
  - REQUIREMENTS_IDEA_V0_1.yaml
  - REQUIREMENTS_PREFIGURATION_DECISION_V0_1.yaml
  - REQUIREMENTS_PROJECT_BUILD_V0_1.yaml
  - DELIVERABLE_CONTRACTS_V0_1.yaml
  - GATES_V0_1.yaml
  - GATE_BINDINGS_V0_1.yaml
  - OVERRIDES_V0_2_G2_CANDIDATE.yaml

role_refs:
  IDEA_DECISION_OWNER: approves Idea decisions and Idea→Project promotion
  BUILD_READY_OWNER: approves Ready for Development handoff
  CONTENT_OWNER: owns factual/delayed content
  TECH_OWNER: owns technical constraints where required
  PRIVACY_OWNER: owns privacy/compliance choices where required
  EXPERT_ROLE: supplies specialist signoff when activated

question_policy:
  requirement_exists_does_not_mean_user_question: true
  ask_only_if_human_authority_or_private_intent_required_and_material_now: true
  one_dominant_user_action_at_a_time: true
  no_global_question_count_cap: true

state_policy:
  targeted_recompute_only: true
  accepted_unknown_if_non_blocking: true
  stale_result_cannot_overwrite_current: true
  progressive_lock: true
  dependency_prerequisites_required_for_actions: true
  dependency_prerequisites_required_for_gate_satisfaction: true
  dependency_prerequisites_transitive: true
  requirement_input_fingerprint_semantics: basis_not_own_output
  machine_result_current_only_when_target_basis_matches: true
  accepted_unknown_scoped_to_current_basis_for_g2: true

research_policy:
  system_first: true
  research_stops_on_decision_sufficiency: true
  competitor_set_requires_material_evidence_value: true
  competitor_materiality_fact: research.competitive_evidence_material
  competitor_materiality_owner: deterministic_g2_evidence_planner
  competitor_materiality_default_for_greenfield: true
  competitor_materiality_can_be_false_when:
    - redesign_is_active
    - existing_audit_has_OBSERVED_resolution
    - evidence_quality_has_CALCULATED_resolution
    - no_explicit_market_comparison_requirement
    - no_material_market_conflict_requires_triangulation
  existing_competitor_output_does_not_force_own_applicability: true
  stale_or_conflicted_audit_cannot_disable_competitor_requirement: true
  free_form_llm_cannot_set_materiality_fact: true
  web_evidence_requires_persisted_source: true

mismatch_policy:
  preserve_history: true
  stop_false_site_vitrine_coverage_claim: true
  require_blueprint_remap: true

machine_contract_invariants:
  - exhaustive_internal_not_visible_form
  - human_question_last_mile
  - research_stops_on_decision_sufficiency
  - AI_inference_not_human_truth
  - source_backed_web_evidence_has_persisted_source
  - requirement_dependencies_are_runtime_preconditions
  - requirement_basis_excludes_own_output
  - stale_machine_result_requires_basis_match
  - prefiguration_is_FOR_DECISION
  - real_user_evidence_distinct_from_AI_simulation
  - presentation_uses_current_snapshot
  - project_inherits_valid_idea_artifacts
  - structural_approval_condition_blocks_promotion
  - requirement_spec_verify_traceability
  - Idea_owner_may_differ_from_Build_Ready_owner
  - developer_implementation_discretion_preserved_for_non_structural_choices
  - deterministic_context_rules_only
  - no_free_text_rule_eval

r0_candidate_contract:
  engine: scripts/r0_engine_v0_5_candidate.py
  tests: scripts/test_r0_engine_v0_5_candidate.py
  context_dsl: CONTEXT_OVERLAYS_V0_3.yaml
  active_production_blueprint_unchanged: SITE_VITRINE@0.4

validation_status:
  status: TARGETED_PASS_FULL_R0_REPLAY_PENDING
  targeted_competitor_context_logic: PASS_2026_09_13
  deterministic_competitor_materiality: PASS_TARGETED_2026_09_13
  basis_fingerprint_stale_safety: PASS_TARGETED_2026_09_13
  current_basis_inflight_deduplication: PASS_TARGETED_2026_09_13
  transitive_dependency_runtime_semantics: PASS_TARGETED_2026_09_13
  full_r0_candidate_replay: PENDING
  production_activation: FORBIDDEN_UNTIL_G1_RUNTIME_E2E_AND_V0_5_R0_PASS

validation_support:
  - ../../runtime/G2_EVIDENCE_MARKET_RUNTIME_DESIGN_V0_1.md
  - ../../runtime/G2_EVIDENCE_MARKET_BACKEND_GAP_AUDIT_20260913.md
  - ../../runtime/G2_EVIDENCE_MARKET_ACQUISITION_MATRIX_V0_1.md
  - ../../runtime/G2_BLUEPRINT_V0_5_CANDIDATE_VALIDATION_20260913.md
  - ../../runtime/G2_REQUIREMENT_BASIS_FINGERPRINT_CONTRACT_V0_1.md
  - ../../runtime/G2_BASIS_FINGERPRINT_VALIDATION_20260913.md
